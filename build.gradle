plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.5.0-prototype'
group = 'de.gruen.ae2categories'
base { archivesName = 'ae2-storage-categories' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.248'
    runs {
        client { client() }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ae2categories'
        }
    }
    mods { ae2categories { sourceSet sourceSets.main } }
}
dependencies {
    implementation files('libs/appliedenergistics2-19.2.17.jar', 'libs/guideme-21.1.17.jar')
    runtimeOnly files('libs/ae2wtlib-19.5.1.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
// Development-only integration tests are never shipped in the playable JAR.
tasks.named('jar') {
    exclude 'de/gruen/ae2categories/dev/**'
    exclude 'data/ae2categories/structure/test_empty.nbt'
}
